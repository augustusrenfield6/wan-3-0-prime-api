[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argolink-wan-prime"
version = "0.1.0"
description = "Argolink Wan 3.0 Prime API client and workflow examples"
requires-python = ">=3.9"
dependencies = ["requests>=2.31,<3"]

[tool.pytest.ini_options]
addopts = "-q"

[project.optional-dependencies]
mcp = ["mcp[cli]>=1,<2"]

[tool.setuptools]
py-modules = ["wan_api", "mcp_server"]
